name: Feature request
description: An idea for a new weather, mode, biome, badge or anything else.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describe what you would like to play, not how it should be coded.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Weather / Apocalypse
        - FINAL ASCENT / daily map
        - TFA Builder
        - Badges / name colors / cosmetics
        - Website / scoreboard
        - Modding API (biomes, weather)
        - Other
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should happen in the game? What would it look, sound and feel like?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it add? Which problem does it solve, or what moment would it create?

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Difficulty, how it works in multiplayer, which biomes, counter-play, related ideas.

  - type: textarea
    id: refs
    attributes:
      label: Pictures or references
      description: Sketches, screenshots, videos or other games that do something similar.
